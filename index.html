<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAVRAKSHAK | Tactical Operations Command</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="./style.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; background: #010e20; }
        .title-page {
            position: relative; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; overflow: hidden;
        }
        .title-bg-video {
            position: absolute; top: 50%; left: 50%; width: 100%; height: 100%;
            transform: translate(-50%, -50%); object-fit: cover; z-index: 1; pointer-events: none;
        }
        .title-scrim {
            position: absolute; inset: 0; background: radial-gradient(circle, rgba(1,14,32,0.4) 0%, rgba(1,14,32,0.85) 100%);
            z-index: 2;
        }
        .title-container {
            position: relative; z-index: 10; width: 92%; max-width: 500px;
            display: flex; flex-direction: column; align-items: center;
            background: rgba(1, 43, 93, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15); padding: 36px 24px; border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .splash-eyebrow { font-family: monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #f25a22; margin-bottom: 16px; font-weight: bold; }
        .splash-icon { font-size: 64px; color: #f25a22; margin-bottom: 18px; }
        .search-anim-container {
            width: 100%; max-width: 280px; height: 40px; margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .search-icon-spin { font-size: 13px; color: #f25a22; }
        .search-anim-text { font-family: monospace; font-size: 11px; letter-spacing: 1px; color: #ffffff; text-transform: uppercase; }
        .btn-enter {
            background: #f25a22; border: none; color: #ffffff;
            padding: 14px 36px; font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
            text-transform: uppercase; border-radius: 30px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 10px; transition: 0.2s all;
            box-shadow: 0 4px 20px rgba(242,90,34,0.5);
        }
        .btn-enter:hover { background: #d94815; transform: scale(1.04); }
        .title-footer-note {
            position: absolute; bottom: 20px; z-index: 10; font-family: monospace;
            font-size: 10px; letter-spacing: 1.5px; color: rgba(255,255,255,0.5); text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="title-page">
        <video class="title-bg-video" autoplay loop muted playsinline>
            <source src="48091-452601156_medium.mp4" type="video/mp4">
        </video>
        <div class="title-scrim"></div>

        <div class="title-container">
            <div class="splash-eyebrow">Coastal Vessel Monitoring &amp; Rescue Grid</div>
            <div class="splash-icon"><i class="fa-solid fa-shield-halved"></i></div>

            <div class="search-anim-container">
                <i class="fa-solid fa-magnifying-glass search-icon-spin"></i>
                <span class="search-anim-text" id="loaderText">Scanning Node Streams...</span>
            </div>

            <a class="btn-enter" href="./surveillance.html"><i class="fa-solid fa-satellite"></i> Initialize System</a>
        </div>

        <div class="title-footer-note">Vessel Node · Control Hub System</div>
    </div>

    <script>
        const statusPhrases = ["Scanning Node Streams...", "Connecting Telemetry...", "Verifying Encryption...", "System Secure"];
        let phraseIndex = 0;
        setInterval(() => {
            const txtNode = document.getElementById('loaderText');
            if (txtNode) {
                phraseIndex = (phraseIndex + 1) % statusPhrases.length;
                txtNode.innerText = statusPhrases[phraseIndex];
            }
        }, 2500);
    </script>
</body>
</html>
